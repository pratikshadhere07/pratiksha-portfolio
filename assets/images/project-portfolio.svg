<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="port-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#150f28" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>
    <linearGradient id="port-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="port-glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="port-glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <filter id="port-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#port-bg)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="250" cy="180" r="220" fill="url(#port-glow-purple)" />
  <circle cx="580" cy="240" r="200" fill="url(#port-glow-cyan)" />

  <!-- Laptop / Browser Device Showcase -->
  <g transform="translate(60, 30)" filter="url(#port-shadow)">
    <!-- Browser Window Outer Shell -->
    <rect width="680" height="390" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

    <!-- Chrome Header -->
    <rect width="680" height="42" rx="16" fill="#131c31" />
    <rect y="30" width="680" height="12" fill="#131c31" />
    <line x1="0" y1="42" x2="680" y2="42" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="24" cy="21" r="5" fill="#ef4444" />
    <circle cx="40" cy="21" r="5" fill="#f59e0b" />
    <circle cx="56" cy="21" r="5" fill="#10b981" />

    <!-- URL Bar -->
    <rect x="180" y="9" width="320" height="24" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" />
    <circle cx="198" cy="21" r="3" fill="#10b981" />
    <text x="210" y="25" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="10" font-weight="500">https://pratiksha-dhere.dev</text>

    <!-- Inner Web Page View: Navbar -->
    <g transform="translate(0, 42)">
      <rect width="680" height="46" fill="rgba(15,23,42,0.85)" />
      <line x1="0" y1="46" x2="680" y2="46" stroke="rgba(255,255,255,0.06)" />
      
      <!-- Brand Logo -->
      <text x="24" y="28" fill="#818cf8" font-family="monospace" font-size="13" font-weight="700">&lt;</text>
      <text x="35" y="28" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">Pratiksha Dhere</text>
      <text x="145" y="28" fill="#818cf8" font-family="monospace" font-size="13" font-weight="700">/&gt;</text>

      <!-- Nav Links -->
      <g transform="translate(370, 27)" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="10" font-weight="500">
        <text x="0" y="0" fill="#f8fafc" font-weight="700">Home</text>
        <text x="45" y="0">About</text>
        <text x="95" y="0">Skills</text>
        <text x="145" y="0" fill="#38bdf8" font-weight="700">Projects</text>
        <text x="210" y="0">Contact</text>
      </g>
    </g>

    <!-- Hero Content Showcase Inside Browser -->
    <g transform="translate(24, 110)">
      <!-- Left Hero Text -->
      <rect x="0" y="0" width="130" height="20" rx="10" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)" />
      <circle cx="10" cy="10" r="3" fill="#10b981" />
      <text x="18" y="13" fill="#a5b4fc" font-family="'Outfit', sans-serif" font-size="8" font-weight="700">AVAILABLE FOR WORK</text>

      <text x="0" y="44" fill="#f8fafc" font-family="'Playfair Display', serif" font-size="24" font-weight="900">Pratiksha Dhere</text>
      
      <text x="0" y="66" fill="url(#port-grad)" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">Android Developer &amp; UI/UX Designer</text>
      
      <text x="0" y="88" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="10" font-weight="400">Crafting high-performance digital experiences at the</text>
      <text x="0" y="102" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="10" font-weight="400">intersection of code, modern aesthetics, and AI.</text>

      <!-- CTA Buttons -->
      <rect x="0" y="122" width="110" height="32" rx="8" fill="url(#port-grad)" />
      <text x="18" y="142" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="9" font-weight="700">Download CV</text>

      <rect x="120" y="122" width="95" height="32" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" />
      <text x="138" y="142" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="9" font-weight="600">Contact Me</text>

      <!-- Mini Project Feature Cards in Preview -->
      <g transform="translate(0, 172)">
        <rect width="180" height="54" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
        <circle cx="20" cy="27" r="10" fill="rgba(99,102,241,0.2)" />
        <text x="38" y="24" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="9" font-weight="700">Interactive Modal</text>
        <text x="38" y="38" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="8">Deep-dive project report</text>
      </g>
    </g>

    <!-- Right Hero Graphic / Floating Avatar & Glass Chips -->
    <g transform="translate(420, 105)">
      <!-- Avatar Circle Background with Glowing Border -->
      <circle cx="110" cy="110" r="85" fill="rgba(99,102,241,0.12)" stroke="url(#port-grad)" stroke-width="2" />
      <circle cx="110" cy="110" r="75" fill="#131b2e" />

      <!-- Monogram initials -->
      <text x="110" y="125" text-anchor="middle" fill="url(#port-grad)" font-family="'Playfair Display', serif" font-size="52" font-weight="900">PD</text>

      <!-- Floating Tech Badges -->
      <g transform="translate(-15, 20)">
        <rect width="80" height="24" rx="12" fill="rgba(15,23,42,0.9)" stroke="rgba(248,152,32,0.4)" />
        <circle cx="12" cy="12" r="4" fill="#f89820" />
        <text x="22" y="15" fill="#f89820" font-family="'Outfit', sans-serif" font-size="8" font-weight="700">Java</text>
      </g>

      <g transform="translate(150, 70)">
        <rect width="85" height="24" rx="12" fill="rgba(15,23,42,0.9)" stroke="rgba(97,218,251,0.4)" />
        <circle cx="12" cy="12" r="4" fill="#61dafb" />
        <text x="22" y="15" fill="#61dafb" font-family="'Outfit', sans-serif" font-size="8" font-weight="700">Python</text>
      </g>

      <g transform="translate(10, 180)">
        <rect width="90" height="24" rx="12" fill="rgba(15,23,42,0.9)" stroke="rgba(6,182,212,0.4)" />
        <circle cx="12" cy="12" r="4" fill="#06b6d4" />
        <text x="22" y="15" fill="#06b6d4" font-family="'Outfit', sans-serif" font-size="8" font-weight="700">Android SDK</text>
      </g>
    </g>

    <!-- Bottom Features Bar -->
    <g transform="translate(24, 345)">
      <line x1="0" y1="0" x2="632" y2="0" stroke="rgba(255,255,255,0.06)" />
      <text x="0" y="24" fill="#64748b" font-family="'Outfit', sans-serif" font-size="9">Pure Modern CSS3 • Glassmorphism Design System • High Performance • 100% Responsive</text>
    </g>
  </g>
</svg>
