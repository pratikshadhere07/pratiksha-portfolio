<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#14112e" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="glow-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#bg-grad-1)" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#8b5cf6" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- Glowing Orbs -->
  <circle cx="400" cy="225" r="220" fill="url(#glow-1)" />
  <circle cx="200" cy="120" r="160" fill="url(#glow-cyan)" />

  <!-- Center Android Phone Mockup -->
  <g transform="translate(260, 20)" filter="url(#card-shadow)">
    <!-- Phone Body Outer Frame -->
    <rect x="0" y="0" width="280" height="410" rx="36" fill="#131728" stroke="#334155" stroke-width="2" />
    <!-- Glass Screen Frame -->
    <rect x="10" y="10" width="260" height="390" rx="28" fill="#0b0f1d" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Speaker notch & Front Camera -->
    <rect x="110" y="18" width="60" height="6" rx="3" fill="#1e293b" />
    <circle cx="185" cy="21" r="3" fill="#334155" />

    <!-- Phone Status Bar -->
    <text x="32" y="38" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="10" font-weight="600">09:41</text>
    <g transform="translate(225, 29)" fill="#94a3b8">
      <path d="M0 8 h3 v-2 h-3 z M4 8 h3 v-4 h-3 z M8 8 h3 v-6 h-3 z M12 8 h3 v-8 h-3 z" />
    </g>

    <!-- App Header -->
    <g transform="translate(25, 52)">
      <rect x="0" y="0" width="230" height="36" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" />
      <circle cx="18" cy="18" r="8" fill="#6366f1" />
      <text x="34" y="22" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">Cypher Assistant</text>
      <!-- Online Pulse -->
      <circle cx="205" cy="18" r="4" fill="#10b981" />
    </g>

    <!-- Assistant Live Status Banner -->
    <g transform="translate(25, 98)">
      <rect x="0" y="0" width="230" height="58" rx="14" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.25)" />
      <text x="14" y="24" fill="#a5b4fc" font-family="'Outfit', sans-serif" font-size="9" font-weight="600" letter-spacing="1">VOICE COMMAND DETECTED</text>
      <text x="14" y="44" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="12" font-weight="700">"Call Pratiksha Dhere"</text>
    </g>

    <!-- Voice Waveform Visualizer -->
    <g transform="translate(45, 175)">
      <rect x="0" y="16" width="4" height="28" rx="2" fill="#6366f1" />
      <rect x="10" y="8" width="4" height="44" rx="2" fill="#8b5cf6" />
      <rect x="20" y="2" width="4" height="56" rx="2" fill="#a855f7" />
      <rect x="30" y="12" width="4" height="36" rx="2" fill="#06b6d4" />
      <rect x="40" y="20" width="4" height="20" rx="2" fill="#6366f1" />
      <rect x="50" y="6" width="4" height="48" rx="2" fill="#a855f7" />
      <rect x="60" y="0" width="4" height="60" rx="2" fill="#06b6d4" />
      <rect x="70" y="10" width="4" height="40" rx="2" fill="#8b5cf6" />
      <rect x="80" y="22" width="4" height="16" rx="2" fill="#6366f1" />
      <rect x="90" y="4" width="4" height="52" rx="2" fill="#06b6d4" />
      <rect x="100" y="14" width="4" height="32" rx="2" fill="#8b5cf6" />
      <rect x="110" y="0" width="4" height="60" rx="2" fill="#a855f7" />
      <rect x="120" y="10" width="4" height="40" rx="2" fill="#06b6d4" />
      <rect x="130" y="20" width="4" height="20" rx="2" fill="#6366f1" />
      <rect x="140" y="8" width="4" height="44" rx="2" fill="#8b5cf6" />
      <rect x="150" y="16" width="4" height="28" rx="2" fill="#6366f1" />
      <rect x="160" y="24" width="4" height="12" rx="2" fill="#3b82f6" />
      <rect x="170" y="26" width="4" height="8" rx="2" fill="#06b6d4" />
    </g>

    <!-- Action Output Card -->
    <g transform="translate(25, 255)">
      <rect x="0" y="0" width="230" height="54" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" />
      <circle cx="24" cy="27" r="14" fill="rgba(16,185,129,0.2)" />
      <path d="M19 27 l4 4 l7 -7" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="48" y="24" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="11" font-weight="600">Dialing Mobile...</text>
      <text x="48" y="40" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="9">+91 90752 94905 (Calling)</text>
    </g>

    <!-- Mic Center Floating Button -->
    <g transform="translate(140, 350)">
      <circle cx="0" cy="0" r="26" fill="url(#primary-grad)" filter="url(#card-shadow)" />
      <!-- Mic Icon -->
      <path d="M-4 -8 a4 4 0 0 1 8 0 v8 a4 4 0 0 1 -8 0 z" fill="#ffffff" />
      <path d="M-7 -1 a7 7 0 0 0 14 0" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="6" x2="0" y2="10" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Left Floating Tech Card -->
  <g transform="translate(50, 110)" filter="url(#card-shadow)">
    <rect width="170" height="90" rx="16" fill="rgba(15,23,42,0.85)" stroke="rgba(255,255,255,0.12)" />
    <circle cx="28" cy="28" r="14" fill="rgba(99,102,241,0.2)" />
    <text x="23" y="33" fill="#818cf8" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">AI</text>
    <text x="50" y="27" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">OpenAI Voice</text>
    <text x="50" y="41" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="9">Natural NLP Engine</text>
    <rect x="18" y="58" width="134" height="20" rx="6" fill="rgba(99,102,241,0.15)" />
    <text x="30" y="72" fill="#a5b4fc" font-family="'Outfit', sans-serif" font-size="9" font-weight="600">Speech-to-Intent: 98.7%</text>
  </g>

  <!-- Right Floating Android Spec Card -->
  <g transform="translate(580, 190)" filter="url(#card-shadow)">
    <rect width="175" height="100" rx="16" fill="rgba(15,23,42,0.85)" stroke="rgba(255,255,255,0.12)" />
    <circle cx="28" cy="28" r="14" fill="rgba(16,185,129,0.2)" />
    <text x="21" y="33" fill="#34d399" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">MAD</text>
    <text x="50" y="26" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">Android Service</text>
    <text x="50" y="40" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="9">Hands-Free Automation</text>
    <text x="18" y="66" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="9">• Background Wake Listener</text>
    <text x="18" y="82" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="9">• Offline Contact Sync</text>
  </g>
</svg>
