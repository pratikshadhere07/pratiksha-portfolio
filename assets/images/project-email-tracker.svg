<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121e" />
      <stop offset="50%" stop-color="#091b1f" />
      <stop offset="100%" stop-color="#050a12" />
    </linearGradient>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <radialGradient id="cyber-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#cyber-bg)" />

  <!-- Grid Overlay -->
  <g opacity="0.08" stroke="#06b6d4" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- Glowing Backdrop Circle -->
  <circle cx="400" cy="225" r="240" fill="url(#cyber-glow)" />

  <!-- Main Security Dashboard Window -->
  <g transform="translate(60, 35)" filter="url(#box-shadow)">
    <!-- Browser/Tool Window Frame -->
    <rect width="680" height="380" rx="16" fill="#0d1526" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Window Title Bar -->
    <rect width="680" height="42" rx="16" fill="#131c31" />
    <rect y="30" width="680" height="12" fill="#131c31" />
    <line x1="0" y1="42" x2="680" y2="42" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Window Buttons -->
    <circle cx="24" cy="21" r="5" fill="#ef4444" />
    <circle cx="40" cy="21" r="5" fill="#f59e0b" />
    <circle cx="56" cy="21" r="5" fill="#10b981" />

    <!-- Address / Title -->
    <rect x="180" y="10" width="320" height="22" rx="6" fill="rgba(255,255,255,0.05)" />
    <text x="210" y="25" fill="#64748b" font-family="'Outfit', sans-serif" font-size="10" font-weight="500">security-audit://email-threat-monitor/v2</text>
    <circle cx="196" cy="21" r="3" fill="#10b981" />

    <!-- Status Badge -->
    <rect x="530" y="10" width="130" height="22" rx="11" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" />
    <circle cx="544" cy="21" r="3" fill="#10b981" />
    <text x="554" y="25" fill="#34d399" font-family="'Outfit', sans-serif" font-size="9" font-weight="700">HEURISTIC ACTIVE</text>

    <!-- Inner Layout: Left Feed & Right Analytics -->
    <!-- Left Panel: Monitored Streams -->
    <g transform="translate(20, 60)">
      <text x="0" y="15" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" letter-spacing="1">EMAIL INSPECTION PIPELINE</text>
      
      <!-- Card 1 (Warning) -->
      <g transform="translate(0, 26)">
        <rect width="320" height="66" rx="10" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.25)" />
        <rect x="12" y="12" width="28" height="28" rx="6" fill="rgba(239,68,68,0.2)" />
        <path d="M26 19 v8 M26 31 v2" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
        <text x="48" y="25" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="11" font-weight="600">Urgent: Account Verification</text>
        <text x="48" y="39" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="9">Sender: service@paypa1-security.xyz</text>
        <rect x="48" y="46" width="115" height="15" rx="4" fill="rgba(239,68,68,0.25)" />
        <text x="54" y="57" fill="#fca5a5" font-family="'Outfit', sans-serif" font-size="8" font-weight="700">3 TRACKING PIXELS</text>
        <text x="250" y="40" fill="#ef4444" font-family="'Outfit', sans-serif" font-size="12" font-weight="800">98% Risk</text>
      </g>

      <!-- Card 2 (Safe) -->
      <g transform="translate(0, 102)">
        <rect width="320" height="66" rx="10" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.2)" />
        <rect x="12" y="12" width="28" height="28" rx="6" fill="rgba(16,185,129,0.2)" />
        <path d="M20 26 l4 4 l8 -8" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round" />
        <text x="48" y="25" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="11" font-weight="600">Weekly Security Newsletter</text>
        <text x="48" y="39" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="9">Sender: alerts@owasp.org</text>
        <rect x="48" y="46" width="105" height="15" rx="4" fill="rgba(16,185,129,0.2)" />
        <text x="54" y="57" fill="#6ee7b7" font-family="'Outfit', sans-serif" font-size="8" font-weight="700">VERIFIED DOMAIN</text>
        <text x="260" y="40" fill="#10b981" font-family="'Outfit', sans-serif" font-size="12" font-weight="800">0% Risk</text>
      </g>

      <!-- Card 3 (Neutralized) -->
      <g transform="translate(0, 178)">
        <rect width="320" height="66" rx="10" fill="rgba(245,158,11,0.06)" stroke="rgba(245,158,11,0.2)" />
        <rect x="12" y="12" width="28" height="28" rx="6" fill="rgba(245,158,11,0.2)" />
        <circle cx="26" cy="26" r="6" stroke="#f59e0b" stroke-width="2" fill="none" />
        <text x="48" y="25" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="11" font-weight="600">Quarterly Invoice #4402</text>
        <text x="48" y="39" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="9">Redirect Chain: 2 hops neutralized</text>
        <rect x="48" y="46" width="125" height="15" rx="4" fill="rgba(245,158,11,0.2)" />
        <text x="54" y="57" fill="#fcd34d" font-family="'Outfit', sans-serif" font-size="8" font-weight="700">SCRAPED TARGET CLEAN</text>
        <text x="250" y="40" fill="#f59e0b" font-family="'Outfit', sans-serif" font-size="12" font-weight="800">12% Risk</text>
      </g>
    </g>

    <!-- Right Panel: Telemetry & Machine Learning Engine -->
    <g transform="translate(370, 60)">
      <text x="0" y="15" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" letter-spacing="1">WEB SCRAPING &amp; ML TELEMETRY</text>

      <!-- Scraping Terminal Box -->
      <g transform="translate(0, 26)">
        <rect width="285" height="135" rx="10" fill="#090e17" stroke="rgba(255,255,255,0.08)" />
        <!-- Terminal Header -->
        <text x="12" y="22" fill="#06b6d4" font-family="monospace" font-size="9">> spider.init(targets=email_links)</text>
        <text x="12" y="40" fill="#64748b" font-family="monospace" font-size="9">[OK] Scraped: https://paypa1-security.xyz</text>
        <text x="12" y="58" fill="#f87171" font-family="monospace" font-size="9">[ALERT] Hidden beacon: 1x1 GIF detected</text>
        <text x="12" y="76" fill="#38bdf8" font-family="monospace" font-size="9">[INFO] WHOIS Domain Age: 2 days old</text>
        <text x="12" y="94" fill="#a78bfa" font-family="monospace" font-size="9">[ML] Model: Random Forest (Phish Prob=0.98)</text>
        <text x="12" y="116" fill="#10b981" font-family="monospace" font-size="9">> action: blocked_pixel &amp; quarantined</text>
      </g>

      <!-- Bottom Metrics Grid -->
      <g transform="translate(0, 175)">
        <rect width="135" height="70" rx="10" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.2)" />
        <text x="14" y="26" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="9" font-weight="600">TRACKERS BLOCKED</text>
        <text x="14" y="52" fill="#06b6d4" font-family="'Outfit', sans-serif" font-size="22" font-weight="800">1,428</text>

        <g transform="translate(150, 0)">
          <rect width="135" height="70" rx="10" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.2)" />
          <text x="14" y="26" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="9" font-weight="600">ML ACCURACY</text>
          <text x="14" y="52" fill="#818cf8" font-family="'Outfit', sans-serif" font-size="22" font-weight="800">96.4%</text>
        </g>
      </g>
    </g>

    <!-- Bottom Footer Tagline -->
    <line x1="20" y1="330" x2="660" y2="330" stroke="rgba(255,255,255,0.06)" />
    <text x="20" y="354" fill="#64748b" font-family="'Outfit', sans-serif" font-size="10">Python 3.11 • Scikit-Learn • BeautifulSoup4 • Ethical Privacy Compliance Protocol</text>
  </g>
</svg>
